<meta charset="utf-8">

<title>btrace viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       background: #f5f5f5; color: #333; }
#container { max-width: 100%; overflow: auto; padding: 12px; }
#container svg { max-width: 100%; height: auto; }
#container svg .edge { cursor: pointer; }
#container svg .edge:hover path:not(.hit-path) { stroke-width: 3; }
#container svg .edge:hover polygon { stroke-width: 2; }
#container svg text { user-select: none; }

#modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 100;
    justify-content: center; align-items: center;
}
#modal-overlay.active { display: flex; }
#modal {
    background: #fff; border-radius: 10px; padding: 24px 28px;
    max-width: 720px; width: 90%; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
}
#modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #e0e0e0;
}
#modal-header h3 { font-size: 14px; font-weight: 600; color: #555; }
#modal-close {
    background: none; border: none; font-size: 22px; cursor: pointer;
    color: #999; line-height: 1;
}
#modal-close:hover { color: #333; }
#modal-meta {
    display: flex; gap: 16px; margin-bottom: 14px;
    font-size: 13px; color: #666; flex-wrap: wrap;
}
#modal-meta span { background: #f0f0f0; padding: 2px 8px; border-radius: 4px; }
#stacks-container { display: flex; gap: 24px; }
.stack-col { flex: 1; min-width: 0; }
.stack-col h4 {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    color: #888; margin-bottom: 8px; letter-spacing: 0.5px;
}
.stack-col.blocked h4 { color: #c0392b; }
.stack-col.waker h4 { color: #2980b9; }
.stack-frames {
    background: #fafafa; border: 1px solid #e8e8e8; border-radius: 6px;
    padding: 8px 0; font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 11.5px; line-height: 1.7;
}
.stack-frames .frame {
    padding: 1px 10px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
}
.stack-frames .frame:nth-child(odd) { background: #f5f5f5; }
.stack-frames .frame:first-child { font-weight: 600; }
.stack-section-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    color: #aaa; padding: 4px 10px 2px; letter-spacing: 0.3px;
}
.stack-section-label:not(:first-child) { border-top: 1px solid #e0e0e0; margin-top: 4px; padding-top: 6px; }
</style>
</head>

(function() {
    var svg = document.querySelector('#container svg');
    if (!svg) return;
    document.querySelectorAll('.edge[data-edgeid] path[stroke]').forEach(function(path) {
        var fill = path.getAttribute('fill');
        if (fill === 'none' || fill === 'transparent') {
            path.setAttribute('pointer-events', 'none');
            var hit = path.cloneNode(false);
            hit.classList.add('hit-path');
            hit.setAttribute('fill', 'none');
            hit.setAttribute('stroke', 'transparent');
            hit.setAttribute('stroke-width', '8');
            hit.setAttribute('pointer-events', 'stroke');
            hit.setAttribute('vector-effect', 'non-scaling-stroke');
            hit.removeAttribute('id');
            hit.removeAttribute('style');
            path.parentNode.insertBefore(hit, path.nextSibling);
        }
    });
})();

function showModal(edgeid) {
    const data = STACKS[edgeid];
    if (!data) { console.warn('No stack data for edgeid:', edgeid); return; }
    document.getElementById('modal-title').textContent =
        data.from + ' \u2192 ' + data.to;
    document.getElementById('modal-meta').innerHTML =
        '<span>' + data.block_cat + '</span>' +
        '<span>' + data.waker_cat + '</span>' +
        '<span>' + data.duration + '</span>' +
        '<span>' + data.count + ' samples</span>';

    function renderFrame(el, f) {
        var d = document.createElement('div'); d.className = 'frame';
        if (typeof f === 'object' && f.s) {
            d.textContent = f.s;
            d.title = f.src ? (f.s + '\n' + f.src) : f.s;
        } else {
            d.textContent = f;
            d.title = f;
        }
        el.appendChild(d);
    }

    const bf = document.getElementById('blocked-frames');
    bf.innerHTML = '';
    if (data.blocked_stack && data.blocked_stack.length) {
        var lbl = document.createElement('div'); lbl.className = 'stack-section-label'; lbl.textContent = 'kernel';
        bf.appendChild(lbl);
        data.blocked_stack.forEach(function(s) { renderFrame(bf, s); });
    }
    if (data.blocked_user_stack && data.blocked_user_stack.length) {
        var lbl = document.createElement('div'); lbl.className = 'stack-section-label'; lbl.textContent = 'user';
        bf.appendChild(lbl);
        data.blocked_user_stack.forEach(function(s) { renderFrame(bf, s); });
    }
    const wf = document.getElementById('waker-frames');
    wf.innerHTML = '';
    if (data.waker_stack && data.waker_stack.length) {
        var lbl = document.createElement('div'); lbl.className = 'stack-section-label'; lbl.textContent = 'kernel';
        wf.appendChild(lbl);
        data.waker_stack.forEach(function(s) { renderFrame(wf, s); });
    }
    if (data.waker_user_stack && data.waker_user_stack.length) {
        var lbl = document.createElement('div'); lbl.className = 'stack-section-label'; lbl.textContent = 'user';
        wf.appendChild(lbl);
        data.waker_user_stack.forEach(function(s) { renderFrame(wf, s); });
    }
    document.getElementById('modal-overlay').classList.add('active');
}

function hideModal() {
    document.getElementById('modal-overlay').classList.remove('active');
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) hideModal();
});
document.getElementById('modal-close').addEventListener('click', hideModal);
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hideModal();
});

document.getElementById('container').addEventListener('click', function(ev) {
    var g = ev.target.closest('.edge[data-edgeid]');
    if (g) showModal(g.getAttribute('data-edgeid'));
});
</script>
